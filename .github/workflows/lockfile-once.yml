name: Generate reproducible dependency lockfile
on:
  push:
    branches: [qa/foundation-stabilization-20261122]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(lock):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and commit dependency lockfile
        run: |
          npm install --package-lock-only --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): pin audited dependency graph"
            git push origin HEAD:qa/foundation-stabilization-20261122
          fi
