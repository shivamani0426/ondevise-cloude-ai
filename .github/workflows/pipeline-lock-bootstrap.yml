name: Pipeline lockfile bootstrap (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/private-evidence-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and pin dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to same feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(lock): resolve pinned pipeline dependencies'
            git push origin HEAD:${{ github.head_ref }}
          fi
